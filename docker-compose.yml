
services:
  database:
    image: postgres:16
    container_name: qlts_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    networks:
      - qlts_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: qlts_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - qlts_network

  app:
    build:
      context: ./app
    container_name: qlts_app
    restart: unless-stopped
    environment:
      DB_HOST: database
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      SECRET_KEY: ${FLASK_SECRET_KEY}
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - qlts_network

  nginx:
    image: nginx:alpine
    container_name: qlts_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - qlts_network

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    container_name: qlts_nginx_exporter
    restart: unless-stopped
    command:
      - "--nginx.scrape-uri=http://nginx:80/stub_status"
    depends_on:
      - nginx
    networks:
      - qlts_network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: qlts_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - qlts_network
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: qlts_cadvisor
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - qlts_network
  prometheus:
    image: prom/prometheus:latest
    container_name: qlts_prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - qlts_network

  grafana:
    image: grafana/grafana:latest
    container_name: qlts_grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - qlts_network

  loki:
    image: grafana/loki:3.5.6
    container_name: qlts_loki
    restart: unless-stopped
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./logging/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - qlts_network

  promtail:
    image: grafana/promtail:3.5.0
    container_name: qlts_promtail
    restart: unless-stopped
    command:
      - "-config.file=/etc/promtail/config.yml"
    ports:
      - "127.0.0.1:9080:9080"
    volumes:
      - ./logging/promtail-config.yml:/etc/promtail/config.yml:ro
      - promtail_positions:/tmp
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - qlts_network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:

networks:
  qlts_network:
    driver: bridge


